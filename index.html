<!DOCTYPE html>
<!-- REGRAS DO FIRESTORE (cole em Firebase Console > Firestore > Regras > Publicar):
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function isAdmin() {
      return request.auth != null
        && exists(/databases/$(database)/documents/admins/$(request.auth.uid));
    }

    // Quem é admin: o usuário só consegue ler o próprio documento; ninguém escreve pelo app.
    match /admins/{uid} {
      allow get: if request.auth != null && request.auth.uid == uid;
      allow list, write: if false;
    }

    // Conteúdo público do site: todos leem, só admin altera.
    match /settings/{id}  { allow read: if true; allow write: if isAdmin(); }
    match /services/{id}  { allow read: if true; allow write: if isAdmin(); }
    match /gallery/{id}   { allow read: if true; allow write: if isAdmin(); }

    // Avaliações: público lê só as aprovadas e envia novas como "pending".
    match /reviews/{id} {
      allow read: if resource.data.status == 'approved' || isAdmin();
      allow create: if (
          request.resource.data.keys().hasOnly(['name','place','rating','text','status','date'])
          && request.resource.data.status == 'pending'
          && request.resource.data.rating is number
          && request.resource.data.rating >= 1 && request.resource.data.rating <= 5
          && request.resource.data.name is string && request.resource.data.name.size() <= 120
          && request.resource.data.text is string && request.resource.data.text.size() <= 2000
        ) || isAdmin();
      allow update, delete: if isAdmin();
    }

    // Pedidos de orçamento: público só cria; admin gerencia.
    match /requests/{id} {
      allow create: if (
          request.resource.data.keys().hasOnly(['createdAt','name','phone','email','address','property','service','urgency','message','status'])
          && request.resource.data.status == 'Novo'
          && request.resource.data.name is string && request.resource.data.name.size() <= 200
          && request.resource.data.message is string && request.resource.data.message.size() <= 3000
        ) || isAdmin();
      allow read, update, delete: if isAdmin();
    }

    // Agendamentos: público só cria; admin gerencia.
    match /appointments/{id} {
      allow create: if (
          request.resource.data.keys().hasOnly(['createdAt','name','phone','address','kind','date','time','notes','status'])
          && request.resource.data.status == 'Pendente'
          && request.resource.data.name is string && request.resource.data.name.size() <= 200
        ) || isAdmin();
      allow read, update, delete: if isAdmin();
    }

    // Horários ocupados: público lê (para esconder horários) e só cria se o ID for "data_hora".
    // Como não pode atualizar, dois clientes não conseguem reservar o mesmo horário.
    match /slots/{slotId} {
      allow read: if true;
      allow create: if (
          request.resource.data.keys().hasOnly(['date','time'])
          && slotId == request.resource.data.date + '_' + request.resource.data.time
        ) || isAdmin();
      allow update, delete: if isAdmin();
    }

    match /clients/{id} { allow read, write: if isAdmin(); }
  }
}
-->

</style>

const slotId=a=>`${a.date}_${a.time}`;

async function initFirebase(){
  const cfg=window.FIREBASE_CONFIG||{};
  if(!cfg.apiKey||!cfg.projectId)throw new Error('config');
  const base='https://www.gstatic.com/firebasejs/10.14.1/';
  const mods=[import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')];
  if(useStorage())mods.push(import(base+'firebase-storage.js'));
  const [a,s,u,t]=await Promise.all(mods);
  APP=a.initializeApp(cfg);FS=s;AU=u;fs=s.getFirestore(APP);auth=u.getAuth(APP);
  if(t){ST=t;storage=t.getStorage(APP)}
}

function loginMsg(t){$('#loginErr').textContent=t||''}
function showLogin(){$('#app').style.display='none';$('#login').style.display='grid';$('#loginBtn').disabled=false}
function authError(e){
  const c=e&&e.code||'';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c))return 'E-mail ou senha incorretos.';
  if(c==='auth/too-many-requests')return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
  if(c==='auth/network-request-failed')return 'Sem conexão. Verifique sua internet.';
  return 'Não foi possível entrar. Tente novamente.';
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();loginMsg('');
  if(!auth){loginMsg('Painel indisponível no momento.');return}
  $('#loginBtn').disabled=true;
  try{await AU.signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#pass').value)}
  catch(err){loginMsg(authError(err));$('#loginBtn').disabled=false}
};
$('#forgot').onclick=async()=>{
  const em=$('#email').value.trim();
  if(!em){loginMsg('Informe seu e-mail acima para receber o link.');return}
  if(!auth)return;
  try{await AU.sendPasswordResetEmail(auth,em)}catch(e){console.error(e)}
  loginMsg('');toast('Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.');
};
$('#logout').onclick=()=>{if(auth)AU.signOut(auth)};

async function isAdmin(user){
  try{const d=await FS.getDoc(dref('admins',user.uid));return d.exists()}catch(e){return false}
}
async function seedIfNeeded(){
  const s=await FS.getDoc(dref('settings','main'));
  if(s.exists())return;
  const b=FS.writeBatch(fs);
  b.set(dref('settings','main'),{company:'VSR',whatsapp:'',phone:'',email:'',address:'',hours:'Segunda a sábado, das 8h às 18h'});
  [
   ['Instalação de iluminação','Projetos e instalação de iluminação LED, spots, fitas, arandelas e iluminação externa.','bulb'],
   ['Fiação e cabeamento','Troca e instalação de fiação, tomadas, interruptores e pontos novos com segurança.','plug'],
   ['Manutenção elétrica','Correção de curtos, quedas de energia, disjuntores desarmando e manutenção preventiva.','wrench'],
   ['Reformas elétricas','Atualização completa da instalação elétrica de casas, apartamentos e salas comerciais.','home'],

  ].forEach((x,i)=>b.set(dref('services',`svc-${i+1}`),{title:x[0],desc:x[1],icon:x[2],price:'',active:true,order:i+1}));
  await b.commit();

function stopData(){unsubs.forEach(u=>u());unsubs=[];loaded=new Set()}
function startData(){
  stopData();
  const err=e=>{console.error(e);toast('Falha ao carregar dados. Verifique sua conexão e as regras do Firestore.')};
  unsubs.push(FS.onSnapshot(dref('settings','main'),s=>{db.settings=s.exists()?s.data():{};onData('settings')},err));
  COLLS.forEach(c=>unsubs.push(FS.onSnapshot(col(c),snap=>{db[c]=snap.docs.map(d=>({id:d.id,...d.data()}));onData(c)},err)));
}
function enterApp(){
  $('#login').style.display='none';$('#app').style.display='block';
  const hash=location.hash.slice(1);if(VIEWS[hash])view=hash;
  nav(view);
}
async function boot(){
  try{await initFirebase()}catch(e){loginMsg('Painel indisponível no momento.');$('#loginBtn').disabled=true;return}
  AU.onAuthStateChanged(auth,async user=>{
    if(!user){stopData();showLogin();return}
    if(!(await isAdmin(user))){loginMsg('Esta conta não tem acesso ao painel.');await AU.signOut(auth);return}
    try{await seedIfNeeded()}catch(e){console.error(e)}
    startData();enterApp();
  });
}

function onData(k){
  if(k)loaded.add(k);
  if($('#app').style.display!=='block')return;
  syncClients();
  clearTimeout(onData.t);
  onData.t=setTimeout(()=>{
    if($('#modal').classList.contains('open')){drawNav();return}
    const a=document.activeElement;
    if(a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){drawNav();return}
    nav(view,true);
  },60);
}
const made=new Set();
function syncClients(){
  if(!['clients','requests','appointments'].every(k=>loaded.has(k)))return;
  const known=new Set(db.clients.map(c=>digits(c.phone)));
  const todo=[];
  [['requests',db.requests],['appointments',db.appointments]].forEach(([c,list])=>list.forEach(r=>{
    if(r.clientSynced===true)return;
    todo.push([c,r]);
  }));
  if(!todo.length)return;
  const b=FS.writeBatch(fs);const newPhones=new Set();
  todo.forEach(([c,r])=>{
    const p=digits(r.phone);
    if(p&&!known.has(p)&&!made.has(p)){made.add(p);newPhones.add(p);b.set(FS.doc(col('clients')),{name:r.name,phone:r.phone,email:r.email||'',address:r.address||'',notes:'',createdAt:todayStr()})}
    b.update(dref(c,r.id),{clientSynced:true});
  });
  b.commit().catch(e=>{console.error(e);newPhones.forEach(p=>made.delete(p))});
}

function modal(title,body,onSave,label='Salvar'){
  $('#modal').innerHTML=`<div class="mbox"><div class="mh"><h3>${title}</h3><button type="button" onclick="closeModal()">✕</button></div><form id="mform">${body}<div class="mf"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="msave">${label}</button></div></form></div>`;
  $('#modal').classList.add('open');
  $('#mform').onsubmit=async e=>{
    e.preventDefault();$('#msave').disabled=true;
    let r;try{r=await onSave(new FormData(e.target),e.target)}catch(x){console.error(x);toast('Não foi possível salvar. Verifique sua conexão e permissões.');r=false}
    if(r===false){$('#msave').disabled=false;return}
    closeModal();onData();
  };
}
const closeModal=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
const F=(l,n,v='',t='text',x='')=>`<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`;
const T=(l,n,v='',x='')=>`<div class="field"><label>${l}</label><textarea name="${n}" ${x}>${esc(v)}</textarea></div>`;
const S=(l,n,opts,v='')=>`<div class="field"><label>${l}</label><select name="${n}">${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val==v?'selected':''}>${esc(lab)}</option>`}).join('')}</select></div>`;
function filterRows(q,id){q=q.toLowerCase();$$('#'+id+' tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
const statusSel=(coll,id,val,opts)=>`<select class="st ${esc(val)}" data-v="${esc(val)}" onchange="this.blur();setStatus('${coll}','${id}',this.value)">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${v}" ${v===val?'selected':''}>${l}</option>`}).join('')}</select>`;
async function run(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){console.error(e);toast('Não foi possível concluir. Verifique sua conexão e permissões.');return false}}

function setStatus(coll,id,v){
  run(async()=>{
    const b=FS.writeBatch(fs);
    b.update(dref(coll,id),{status:v});
    if(coll==='appointments'){
      const a=db.appointments.find(x=>x.id===id);
      if(a){if(v==='Cancelado')b.delete(dref('slots',slotId(a)));else b.set(dref('slots',slotId(a)),{date:a.date,time:a.time})}
    }
    await b.commit();
  },'Status atualizado');
}
function del(coll,id,msg){
  if(!confirm(msg||'Tem certeza que deseja excluir? Essa ação não pode ser desfeita.'))return;
  run(async()=>{
    const b=FS.writeBatch(fs);
    b.delete(dref(coll,id));
    if(coll==='appointments'){const a=db.appointments.find(x=>x.id===id);if(a)b.delete(dref('slots',slotId(a)))}
    await b.commit();
    if(coll==='gallery')await removeStoredImage((db.gallery.find(x=>x.id===id)||{}).img);
  },'Excluído');
}

async function removeStoredImage(url){
  if(!storage||!url||!/^https:\/\/firebasestorage|^gs:\/\//.test(url))return;
  try{await ST.deleteObject(ST.ref(storage,url))}catch(e){console.error(e)}
}
function resizeImage(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}
async function prepareImage(file){
  if(useStorage()){
    const data=await resizeImage(file,1600,.85);
    const blob=await (await fetch(data)).blob();
    const r=ST.ref(storage,`gallery/${uid()}.jpg`);
    await ST.uploadBytes(r,blob,{contentType:'image/jpeg'});
    return ST.getDownloadURL(r);
  }
  for(const [m,q] of [[1000,.78],[800,.7],[640,.62],[520,.55]]){
    const d=await resizeImage(file,m,q);
    if(d.length<850000)return d;
  }
  throw new Error('big');
}

function editAppt(id){
  const a=db.appointments.find(x=>x.id===id)||{};
  const slots=['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];
  modal(id?'Editar agendamento':'Novo agendamento',
   `<div class="grid2">${F('Nome','name',a.name,'text','required')}${F('Telefone','phone',a.phone,'tel','required')}</div>${F('Endereço','address',a.address)}
    <div class="grid2">${S('Tipo','kind',['Revisão elétrica','Manutenção preventiva','Manutenção corretiva','Visita técnica para orçamento'],a.kind)}${S('Status','status',APP_ST,a.status||'Confirmado')}</div>
    <div class="grid2">${F('Data','date',a.date||todayStr(),'date','required')}${S('Horário','time',slots,a.time)}</div>${T('Observações','notes',a.notes)}`,
   async fd=>{
     const o=Object.fromEntries(fd);
     if(db.appointments.some(x=>x.id!==id&&x.date===o.date&&x.time===o.time&&x.status!=='Cancelado')&&o.status!=='Cancelado'){alert('Já existe um agendamento nesse dia e horário.');return false}
     const b=FS.writeBatch(fs);
     if(id&&(a.date!==o.date||a.time!==o.time))b.delete(dref('slots',slotId(a)));
     if(o.status!=='Cancelado')b.set(dref('slots',slotId(o)),{date:o.date,time:o.time});
     else if(id)b.delete(dref('slots',slotId(o)));
     const ref=id?dref('appointments',id):FS.doc(col('appointments'));
     b.set(ref,id?o:{createdAt:new Date().toISOString(),...o},{merge:true});
     await b.commit();toast('Agendamento salvo');
   });
}

function editService(id){
  const s=db.services.find(x=>x.id===id)||{};
  modal(id?'Editar serviço':'Novo serviço',
   `${F('Título','title',s.title,'text','required')}${T('Descrição','desc',s.desc,'required')}
    <div class="grid2">${F('Preço (opcional)','price',s.price,'text','placeholder="Ex.: a partir de R$ 100"')}${S('Ícone','icon',ICON_CHOICES.map(i=>[i,i]),s.icon||'bolt')}</div>
    ${S('Visibilidade','active',[['1','Visível no site'],['0','Oculto']],s.active===false?'0':'1')}`,
   async fd=>{
     const o=Object.fromEntries(fd);o.active=o.active==='1';
     if(id)await FS.setDoc(dref('services',id),o,{merge:true});else await FS.addDoc(col('services'),{...o,order:Date.now()});
     toast('Serviço salvo');
   });
}

R.gallery=()=>{
  action('Adicionar foto','editPhoto()');
  const list=[...db.gallery].sort(byDesc('createdAt'));
  return list.length?`<div class="photos">${list.map(g=>`
   <div class="photo"><img src="${esc(g.img)}" alt="${esc(g.title)}"><div class="pb"><b>${esc(g.title)}</b><span class="c">${esc(g.category||'Sem categoria')}</span><div style="font-size:.8rem;color:var(--muted);margin-bottom:12px">${esc(g.desc||'')}</div>
   <div class="acts"><button class="btn ghost xs" onclick="editPhoto('${g.id}')">Editar</button><button class="btn danger xs" onclick="del('gallery','${g.id}')">Excluir</button></div></div></div>`).join('')}</div>`
  :'<div class="box empty">Nenhuma foto ainda. Clique em “Adicionar foto”.</div>';
};
function previewFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#pv').src=r.result;$('#pv').style.display='block'};r.readAsDataURL(f)}
function editPhoto(id){
  const g=db.gallery.find(x=>x.id===id)||{};
  const cats=[...new Set(['Iluminação','Fiação','Manutenção','Reformas','Predial',...db.gallery.map(x=>x.category)])].filter(Boolean);
  modal(id?'Editar foto':'Adicionar foto',
   `<img id="pv" class="preview" src="${esc(g.img||'')}" style="${g.img?'':'display:none'}" alt="">
    <div class="field"><label>Imagem ${id?'(deixe vazio para manter a atual)':'*'}</label><input type="file" name="file" accept="image/*" onchange="previewFile(this)"></div>
    ${F('…ou link da imagem (URL)','url','','url','placeholder="https://..."')}
    ${F('Título','title',g.title,'text','required')}
    <div class="field"><label>Categoria</label><input name="category" list="cats" value="${esc(g.category||'')}" placeholder="Escolha ou digite"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
    ${T('Descrição','desc',g.desc)}`,
   async fd=>{
     const file=fd.get('file'),url=(fd.get('url')||'').trim();let img=g.img||'';
     if(file&&file.size){
       try{img=await prepareImage(file)}catch(e){console.error(e);alert('Não foi possível enviar essa imagem. Tente uma foto menor.');return false}
       if(id&&g.img&&g.img!==img)await removeStoredImage(g.img);
     }else if(url&&url!==img){img=url}
     if(!img){alert('Selecione uma imagem ou informe um link.');return false}
     const o={title:fd.get('title'),category:(fd.get('category')||'').trim(),desc:fd.get('desc'),img};
     if(id)await FS.setDoc(dref('gallery',id),o,{merge:true});else await FS.addDoc(col('gallery'),{...o,createdAt:new Date().toISOString()});
     toast('Foto salva');
   });
}

R.reviews=()=>{
  action('Nova avaliação','editReview()');
  const list=[...db.reviews].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||String(b.date||'').localeCompare(String(a.date||'')));
  const rows=list.map(r=>`<tr><td>${fmtDate(r.date)}</td><td><b>${esc(r.name)}</b><small>${esc(r.place||'')}</small></td><td>${stars(+r.rating||0)}<div class="msg">${esc(r.text)}</div></td>
   <td>${statusSel('reviews',r.id,r.status,[['pending','Pendente'],['approved','Publicada'],['hidden','Oculta']])}</td>
   <td><div class="acts"><button class="btn ghost xs" onclick="editReview('${r.id}')">Editar</button><button class="btn danger xs" onclick="del('reviews','${r.id}')">Excluir</button></div></td></tr>`).join('');
  return `<div class="box"><div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Avaliação</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div>${list.length?'':'<div class="empty">Sem avaliações.</div>'}</div>`;
};
function editReview(id){
  const r=db.reviews.find(x=>x.id===id)||{};
  modal(id?'Editar avaliação':'Nova avaliação',
   `<div class="grid2">${F('Nome','name',r.name,'text','required')}${F('Tipo / Local','place',r.place)}</div>
    <div class="grid2">${S('Nota','rating',[5,4,3,2,1].map(n=>[String(n),'★'.repeat(n)]),String(r.rating||5))}${S('Status','status',[['approved','Publicada'],['pending','Pendente'],['hidden','Oculta']],r.status||'approved')}</div>${T('Comentário','text',r.text,'required')}`,
   async fd=>{
     const o=Object.fromEntries(fd);o.rating=+o.rating;
     if(id)await FS.setDoc(dref('reviews',id),o,{merge:true});else await FS.addDoc(col('reviews'),{date:todayStr(),...o});
     toast('Avaliação salva');
   });
}

R.settings=()=>{
  const s=db.settings;
  setTimeout(()=>{
    const f=$('#setForm');if(!f)return;
    f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.whatsapp=digits(o.whatsapp);
      if(await run(()=>FS.setDoc(dref('settings','main'),o,{merge:true}),'Configurações salvas'))drawNav()};
    $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup.json';a.click()};
    $('#pw').onclick=async()=>{const u=auth.currentUser;if(!u||!u.email)return;try{await AU.sendPasswordResetEmail(auth,u.email);toast('Enviamos um link de redefinição para '+u.email)}catch(e){console.error(e);toast('Não foi possível enviar o e-mail agora.')}};
  });
  return `<div class="two">
   <form class="box" id="setForm"><h3>Empresa e contato</h3>
    ${F('Nome da empresa','company',s.company||'VSR','text','required')}
    ${F('WhatsApp (com DDD, só números)','whatsapp',s.whatsapp||'','text','placeholder="5527999999999" inputmode="numeric"')}
    <div class="grid2">${F('Telefone exibido','phone',s.phone||'')}${F('E-mail','email',s.email||'')}</div>
    ${F('Endereço','address',s.address||'')}${F('Horário de atendimento','hours',s.hours||'')}
    <button class="btn">Salvar configurações</button></form>
   <div class="box"><h3>Acesso e backup</h3><p style="color:var(--muted);font-size:.88rem;margin-bottom:16px">Altere sua senha por e-mail ou baixe uma cópia dos dados.</p>
    <div class="acts"><button class="btn ghost" id="pw">Redefinir senha por e-mail</button><button class="btn ghost" id="exp">Exportar backup</button></div></div></div>`;
};

boot();
</script>
</body>
